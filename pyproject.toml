[project]
name = "beancount-import-sparkasse"
version = "0.4.0-beta.0"
description = "Beancount importer plugin for Sparkasse CSV-CAMT exports"
authors = [
    {name = "Jan Laermann", email = "laermannjan@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
keywords = ["beancount", "plain-text-accounting", "ledger", "sparkasse"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Plugins",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Text Processing",
    "Typing :: Typed"
]
dependencies = [
    "beancount>=2.3.5",
    "beangulp",
    "PyYAML>=6.0"
]

[dependency-groups]
dev = [
    "black>=22.6.0",
    "flake8>=4.0.1",
    "isort>=5.10.1",
    "pre-commit>=2.20.0",
    "pytest>=8.4.2",
]

[project.urls]
Repository = "https://github.com/laermannjan/beancount-import-sparkasse"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.isort]
profile = "black"
src_paths = ["beancount_import_sparkasse"]
